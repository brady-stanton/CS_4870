    <script type="importmap">
        {
            "imports": {
              "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/": "https://unpkg.com/three@0.160.0/"
            }
        }
    </script>
</head>
<body>
<script type="module">
    import {ThreeEngine, get_default_lil_gui, refresh_displays} from "../js/utils/utils_three.js";

    // todo: recreate this visualization, demonstrating your understanding of U(1)
    // todo: https://yale-cpsc-487-587-internal-djrakita-c95fa6c3239a481a48d29a6b0fd.gitlab.io/html/visualizations/point_mapping_2D_complex_numbers_isometry.html
    // todo: (no need to draw the unit circle here)
    // todo: or, feel free to come up with any visualization here that demonstrates your understanding of U(1)

    let settings = {
        draw_points: true,
        draw_wireframe: true,
        draw_mesh: true,
        point_size: 0.02,
        theta: 0.0
    }

    let actions = {
        reset_matrix: function() {
            settings.theta = 0.0;
            refresh_displays(gui);
        }
    };

    let gui = get_default_lil_gui();
    gui.add(settings, 'draw_points').name('Draw Points');
    gui.add(settings, 'draw_wireframe').name('Draw Wireframe');
    gui.add(settings, 'point_size', 0.001, 0.03).name('Point Size');

    let folder = gui.addFolder('Complex Num Controls');
    folder.add(settings, 'theta', -1 * Math.PI, 1 * Math.PI).name('theta');
    folder.add(actions, 'reset_matrix').name('Reset');

    let engine = ThreeEngine.new_default_2d();

    engine.animation_loop(function() {
        // U(1) element is just a complex number of the form e^(i*theta) = [cos(theta), sin(theta)]
        const u_real = Math.cos(settings.theta);
        const u_imag = Math.sin(settings.theta);

        // pts matrix 
        const n = 5;
        const grid = [];

        for (let i = 0; i <= n; i++) {
            for (let j = 0; j <= n; j++) {
                let x = -1 + 2 * i / n;
                let y = -1 + 2 * j / n;
                grid.push([x, y, 0]);
            }
        }

        // rotation by U(1) 
        const rotated = grid.map(p => {
            const x = p[0];
            const y = p[1];

            const new_x = (u_real * x) - (u_imag * y);
            const new_y = (u_imag * x) + (u_real * y);

            return [new_x, new_y, 0];
        });

        if (settings.draw_wireframe) {
            for (let i = 0; i <= n; i++) {
                for (let j = 0; j < n; j++) {

                    let idx1 = i*(n+1) + j;
                    let idx2 = i*(n+1) + (j+1);
                    engine.draw_debug_line(rotated[idx1], rotated[idx2], 0x00eeff, 0.003);
                }
            }

            for (let j = 0; j <= n; j++) {
                for (let i = 0; i < n; i++) {

                    let idx1 = i*(n+1) + j;
                    let idx2 = (i+1)*(n+1) + j;
                    engine.draw_debug_line(rotated[idx1], rotated[idx2], 0x00eeff, 0.003);
                }
            }
        }

        if (settings.draw_points) {
            for (let i = 0; i < rotated.length; i++) {
                engine.draw_debug_sphere(rotated[i], settings.point_size, 0xfff200, 1.0);
            }
        }
    });

</script>
</body>
