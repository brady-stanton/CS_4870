        {
            "imports": {

<body>
<script type="module">
    import {ThreeEngine, get_default_lil_gui, refresh_displays} from "../js/utils/utils_three.js";

    // todo: recreate this visualization, demonstrating your understanding of SE(2)
    // todo: https://yale-cpsc-487-587-internal-djrakita-c95fa6c3239a481a48d29a6b0fd.gitlab.io/html/visualizations/point_mapping_2D_direct_isometry.html
    // todo: (no need to draw the unit circle here)
    // todo: or, feel free to come up with any visualization here that demonstrates your understanding of SE(2)
    
    let settings = {
        draw_points: true,
        draw_wireframe: true,
        draw_mesh: true,
        point_size: 0.02,
        t_x: 0.0,
        t_y: 0.0,
        theta: 0.0
    }

    let actions = {
        reset_matrix: function() {
            settings.theta = 0.0;
            settings.t_x = 0.0;
            settings.t_y = 0.0;
            refresh_displays(gui);
        }
    };

    let gui = get_default_lil_gui();
    gui.add(settings, 'draw_points').name('Draw Points');
    gui.add(settings, 'draw_wireframe').name('Draw Wireframe');
    gui.add(settings, 'point_size', 0.001, 0.03).name('Point Size');

    let folder = gui.addFolder('Isometry Controls');
    folder.add(settings, 't_x', -1.0, 1.0).name('Translation X');
    folder.add(settings, 't_y', -1.0, 1.0).name('Translation Y');
    folder.add(settings, 'theta', -1 * Math.PI, 1 * Math.PI).name('Rotation angle');
    folder.add(actions, 'reset_matrix').name('Reset');

    let engine = ThreeEngine.new_default_2d();

    engine.animation_loop(function() {
        const c = Math.cos(settings.theta);
        const s = Math.sin(settings.theta);

        // SE(2) matrix
        const R = [
            [c, -s, settings.t_x],
            [s,  c, settings.t_y],
            [0,  0, 1]
        ];

        // pts matrix 
        const n = 5;
        const grid = [];

        for (let i = 0; i <= n; i++) {
            for (let j = 0; j <= n; j++) {
                let x = -1 + 2 * i / n;
                let y = -1 + 2 * j / n;
                grid.push([x, y, 1]);
            }
        }

        // rotation and translation by SE(2) matrix
        const rotated = grid.map(p => {
            const x = p[0];
            const y = p[1];

            return [
                (c * x) - (s * y) + settings.t_x,
                (s * x) + (c * y) + settings.t_y,
                1
            ]

        });

        if (settings.draw_wireframe) {
            for (let i = 0; i <= n; i++) {
                for (let j = 0; j < n; j++) {

                    let idx1 = i*(n+1) + j;
                    let idx2 = i*(n+1) + (j+1);
                    engine.draw_debug_line(rotated[idx1], rotated[idx2], 0x00eeff, 0.003);
                }
            }

            for (let j = 0; j <= n; j++) {
                for (let i = 0; i < n; i++) {

                    let idx1 = i*(n+1) + j;
                    let idx2 = (i+1)*(n+1) + j;
                    engine.draw_debug_line(rotated[idx1], rotated[idx2], 0x00eeff, 0.003);
                }
            }
        }

        if (settings.draw_points) {
            for (let i = 0; i < rotated.length; i++) {
                engine.draw_debug_sphere(rotated[i], settings.point_size, 0xfff200, 1.0);
            }
        }
    });

</script>
